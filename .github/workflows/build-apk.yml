name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # This repo only contains lib/ and pubspec.yaml. This step generates
      # the missing android/ platform folder (gradle wrapper, manifest,
      # MainActivity, icons, etc.) without touching main.dart or pubspec.yaml.
      - name: Generate Android platform files
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name amar_porikolpona --org com.amarporikolpona
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
